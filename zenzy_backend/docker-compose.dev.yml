# Local development: a single-node MongoDB replica set (transactions need a replica set).
#   docker compose -f docker-compose.dev.yml up -d
# Connection string: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
services:
  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - zenzy_mongo:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it is primary.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

volumes:
  zenzy_mongo:
